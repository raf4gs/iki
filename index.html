<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IKI</title>
<style>
  :root { --fondo: #ffffff; --texto: #1a1a1a; --suave: #6b6b6b; --accent: #c2410c; }
  @media (prefers-color-scheme: dark) { :root { --fondo: #121212; --texto: #f2f2f2; --suave: #a0a0a0; } }
  html, body { height: 100%; margin: 0; }
  body { background: var(--fondo); color: var(--texto); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; align-items: center; justify-content: center; text-align: center; }
  h1 { font-size: 2.5rem; margin: 0 0 .5rem; }
  p { color: var(--suave); margin: 0; }
  #version { display: block; margin-top: 1.5rem; font-size: .85rem; color: var(--suave); }
</style>
</head>
<body>
<main>
  <h1>IKI</h1>
  <p>Sitio en preparación.</p>
  <span id="version">V1.01</span>
</main>
</body>
</html>
