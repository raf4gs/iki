      .catch(function () { estado('Sin conexión'); });
  }

  function cargar() {
    return fetch(SB + '?select=pregunta_id,valores,nota', { headers: H }).then(function (r) { return r.ok ? r.json() : []; }).then(function (f) {
      f.forEach(function (x) { R[x.pregunta_id] = { valores: x.valores || [], nota: x.nota || '' }; });
      var k = PREG.findIndex(function (p) { return !R[p.id]; }); i = k < 0 ? 0 : k; fin = k < 0 && f.length >= PREG.length;
    }).catch(function () {});
  }

  function elegir(p, v) {
    var a = valores(p).slice(), k = a.indexOf(v);
    if (p.multi) { if (k >= 0) a.splice(k, 1); else a.push(v); } else a = [v];
    R[p.id] = { valores: a, nota: (R[p.id] && R[p.id].nota) || '' };
    aplicar(); guardar(p); pintar(false);
    if (!p.multi) setTimeout(function () { if (PREG[i] === p) siguiente(); }, 420);
  }

  function siguiente() { if (i < PREG.length - 1) { i++; pintar(true); } else { fin = true; pintar(true); } window.scrollTo({ top: 0, behavior: 'smooth' }); }
  function anterior() { if (fin) { fin = false; i = PREG.length - 1; } else if (i > 0) i--; pintar(true); }

  function pintar(anim) {
    var v = $('#vista'), p = PREG[i], pct;
    if (fin) {
      pct = 100; $('#cont').textContent = 'Fase completada';
      v.innerHTML = '<div class="tarjeta" style="' + (anim ? '' : 'animation:none') + '"><div class="etq">Enlace completado</div><h2>Ya tengo tu primer perfil visual</h2><p class="sub">La aplicación ya se ha adaptado a lo que has elegido. La fase de nudo profundizará en estos datos.</p>' +
        PREG.filter(function (q) { return q.op; }).map(function (q) { var a = valores(q).map(function (x) { return etiq(q, x); }); return '<div class="fila"><span>' + q.t + '</span><b>' + (a.length ? a.join(', ') : 'Sin responder') + '</b></div>'; }).join('') +
        '<div class="acciones"><button class="btn" id="ant" type="button">Revisar respuestas</button></div></div>';
    } else {
      pct = Math.round(i / PREG.length * 100); $('#cont').textContent = 'Pregunta ' + (i + 1) + ' de ' + PREG.length;
      var h = '<div class="tarjeta" style="' + (anim ? '' : 'animation:none') + '"><div class="etq">' + p.t + '</div><h2>' + p.q + '</h2><p class="sub">' + p.s + '</p>';
      if (p.texto) h += '<textarea id="nota" placeholder="Escribe aquí"></textarea>';
      else h += '<div class="ops">' + p.op.map(function (o) { var on = valores(p).indexOf(o.v) >= 0; return '<button type="button" class="op' + (on ? ' elegida' : '') + '" role="' + (p.multi ? 'checkbox' : 'radio') + '" aria-checked="' + on + '" data-v="' + o.v + '"><span class="sw" style="' + o.sw + '">' + (o.tx || '') + '</span><span><b>' + o.l + '</b><small>' + o.d + '</small></span></button>'; }).join('') + '</div>';
      var ok = p.texto || valores(p).length > 0;
      h += '<div class="acciones">' + (i > 0 ? '<button class="btn" id="ant" type="button">Anterior</button>' : '') + '<button class="btn pri" id="sig" type="button"' + (ok ? '' : ' disabled') + '>' + (i === PREG.length - 1 ? 'Finalizar' : 'Continuar') + '</button></div></div>';
      v.innerHTML = h;
      if (p.texto) { var n = $('#nota'); n.value = (R[p.id] && R[p.id].nota) || ''; n.addEventListener('change', function () { R[p.id] = { valores: [], nota: n.value }; guardar(p); }); }
    }
    $('#rel').style.width = pct + '%';
    var a = $('#ant'); if (a) a.addEventListener('click', anterior);
    var s = $('#sig'); if (s) s.addEventListener('click', function () { if (p && p.texto) { var n = $('#nota'); R[p.id] = { valores: [], nota: n.value }; guardar(p); } siguiente(); });
    document.querySelectorAll('.op').forEach(function (b) { b.addEventListener('click', function () { elegir(p, b.getAttribute('data-v')); }); });
    pintarPerfil();
  }

  window.IKI = { ir: function (n) { fin = n >= PREG.length; i = Math.min(n, PREG.length - 1); pintar(false); } };
  cargar().then(function () { aplicar(); pintar(false); });
  pintar(false);
})();
</script>
