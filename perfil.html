  .op:hover { transform: translateY(-1px); }
  .op.elegida { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent); }

  .op b { display: block; font-size: 1rem; }
  .op small { display: block; font-size: .82rem; color: var(--suave); margin-top: 2px; }
  textarea { width: 100%; min-height: 120px; padding: 14px; border-radius: var(--radio); border: 1.5px solid var(--borde); background: transparent; color: inherit; font: inherit; font-size: 16px; resize: vertical; }

  .fila { display: flex; justify-content: space-between; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--borde); font-size: .9rem; }
  .fila:last-child { border-bottom: 0; }

  textarea.corta { min-height: 84px; margin-top: var(--gap); }
  #estado { min-height: 1em; font-size: .78rem; color: var(--suave); text-align: right; }

      { v: 'movil', l: 'Móvil', d: 'En cualquier lugar' },
      { v: 'ordenador', l: 'Ordenador', d: 'Sesiones de trabajo' },
      { v: 'ambos', l: 'Ambos por igual', d: 'Se adapta a los dos' } ] },
    { id: 'pantallas', t: 'Pantallas', q: '¿Qué pantallas imaginas?', s: 'Nómbralas aunque sea de forma aproximada.', texto: true, req: true, ph: 'Una por línea' },
    { id: 'exito', t: 'Éxito', q: '¿Cómo sabrás que funciona?', s: 'Qué debería ocurrir para que estés satisfecho.', texto: true, req: true, ph: 'Escribe aquí' },
    { id: 'referencia', t: 'Referencias', q: '¿Hay alguna web o app parecida?', s: 'Indica nombres o enlaces. Si no hay ninguna, escribe que no.', texto: true, req: true, ph: 'Escribe aquí' },
    { id: 'sobria', t: 'Sobriedad', q: '¿Qué significa para ti «sobria»?', s: 'Elegiste una sensación sobria. Puedes elegir varias.', multi: true, op: [
      { v: 'poco', l: 'Pocos colores', d: 'Mucho espacio vacío' },
      { v: 'serio', l: 'Tono serio', d: 'Textos formales y claros' },
      { v: 'discreta', l: 'Animaciones discretas', d: 'Nada llamativo' },
      { v: 'oscura', l: 'Tonos oscuros', d: 'Fondos profundos' } ] },
    { id: 'vibrante', t: 'Energía', q: '¿Dónde debe notarse la energía?', s: 'También elegiste vibrante y cálida. Puedes elegir varias.', multi: true, op: [
      { v: 'acento', l: 'En el color de acento', d: 'Pequeños toques de color' },
      { v: 'graficos', l: 'En gráficos y datos', d: 'Visualizaciones con vida' },
      { v: 'animacion', l: 'En las animaciones', d: 'Movimiento fluido' },
      { v: 'ilustracion', l: 'En las ilustraciones', d: 'Dibujos con carácter' },
      { v: 'tono', l: 'En el tono de los textos', d: 'Un lenguaje cercano' } ] }
  ];
  ENL.forEach(function (p) { p.fase = 'enlace'; });
  NUD.forEach(function (p) { p.fase = 'nudo'; });
  NUD.forEach(function (p) { (p.op || []).forEach(function (o) { o.sw = o.sw || DEF; o.tx = o.tx || o.l.charAt(0); }); });
  ENL.concat(NUD).forEach(function (p) { (p.op || []).forEach(function (o) { o.tg = o.tg || []; }); });
  var LIST = { enlace: ENL, nudo: NUD }, NOM = { enlace: 'Enlace', nudo: 'Nudo' };
  var fa = 'enlace', PREG = ENL;

  var R = {}, i = 0, fin = false, cargado = false;
  var $ = function (s) { return document.querySelector(s); };

  function estado(t) { $('#estado').textContent = t; }
  function valores(p) { return (R[p.id] && R[p.id].valores) || []; }
  function notaDe(p) { return (R[p.id] && R[p.id].nota) || ''; }
  function respondida(p) { return !!R[p.id]; }
  function completa(f) { return LIST[f].every(respondida); }
  function primera(f) { var k = LIST[f].findIndex(function (p) { return !respondida(p); }); return k < 0 ? 0 : k; }
  function buscar(p, v) { return (p.op || []).filter(function (x) { return x.v === v; })[0]; }
  function etiq(p, v) { var o = buscar(p, v); return o ? o.l : v; }

  function aplicar() {
    var r = document.documentElement, c = {};
    ENL.forEach(function (p) { valores(p).forEach(function (v) { var o = buscar(p, v); if (o && o.ap) Object.keys(o.ap).forEach(function (k) { c[k] = o.ap[k]; }); }); });
    if (c.acento) { r.style.setProperty('--accent', c.acento[0]); r.style.setProperty('--accent2', c.acento[1]); }
    if (c.tema) r.setAttribute('data-tema', c.tema);
    if (c.sup) r.setAttribute('data-sup', c.sup);
    if (c.radio != null) r.style.setProperty('--radio', c.radio + 'px');
    if (c.gap != null) r.style.setProperty('--gap', c.gap + 'px');
    if (c.fuente) r.style.setProperty('--fuente', c.fuente);
    if (c.mov != null) r.style.setProperty('--mov', c.mov + 's');
  }

  function tendencias() {
    var n = {};
    ENL.concat(NUD).forEach(function (p) { valores(p).forEach(function (v) { var o = buscar(p, v); (o ? o.tg : []).forEach(function (t) { n[t] = (n[t] || 0) + 1; }); }); });
    return Object.keys(n).sort(function (a, b) { return n[b] - n[a]; }).slice(0, 6).map(function (t) { return t.charAt(0).toUpperCase() + t.slice(1); });
  }

  function pintarPerfil() {
    var t = tendencias(), e = $('#perfil');
    e.innerHTML = '<h3>Lo que voy detectando</h3>' + (t.length ? '<div class="chips">' + t.map(function (x) { return '<span class="chip">' + x + '</span>'; }).join('') + '</div>' : '<p class="vacio">Aún sin datos.</p>');
  }

  function pintarFases() {
    $('#fases').innerHTML =
      '<button type="button" class="fase' + (fa === 'enlace' ? ' actual' : '') + '" data-f="enlace">Enlace</button>' +
      '<button type="button" class="fase' + (fa === 'nudo' ? ' actual' : '') + '" data-f="nudo"' + (completa('enlace') ? '' : ' disabled') + '>Nudo</button>' +
      '<span class="fase bloq">Desenlace</span>';
    document.querySelectorAll('#fases button').forEach(function (b) { b.addEventListener('click', function () { cambiarFase(b.getAttribute('data-f')); }); });
  }

  function cambiarFase(f) { if (f === fa) return; fa = f; PREG = LIST[f]; fin = false; i = primera(f); pintar(true); }

  function guardar(p) {
    var tg = [];
    valores(p).forEach(function (x) { var o = buscar(p, x); if (o) tg = tg.concat(o.tg); });
    estado('Guardando');
    IKIAuth.cabeceras().then(function (h) { return fetch(SB + '?on_conflict=pregunta_id', { method: 'POST', headers: Object.assign({ Prefer: 'resolution=merge-duplicates,return=minimal' }, h), body: JSON.stringify({ pregunta_id: p.id, fase: p.fase, pregunta: p.q, valores: valores(p), etiquetas: tg, nota: notaDe(p) || null, actualizado_at: new Date().toISOString() }) }); })
      .then(function (r) { estado(r.ok ? 'Guardado' : 'No se pudo guardar'); })
      .catch(function () { estado('Sin conexión'); });
  }

  function cargar() {
    return IKIAuth.cabeceras().then(function (h) { return fetch(SB + '?select=pregunta_id,valores,nota', { headers: h }); }).then(function (r) { return r.ok ? r.json() : []; }).then(function (f) {
      f.forEach(function (x) { R[x.pregunta_id] = { valores: x.valores || [], nota: x.nota || '' }; });
      fa = completa('enlace') ? 'nudo' : 'enlace'; PREG = LIST[fa];
      if (completa(fa)) { fin = true; i = PREG.length - 1; } else i = primera(fa);
    }).catch(function () {});
  }

  function textoActual() { var n = $('#nota'); return n ? n.value : null; }

  function elegir(p, v) {
    var a = valores(p).slice(), k = a.indexOf(v), t = textoActual();
    if (p.multi) { if (k >= 0) a.splice(k, 1); else a.push(v); } else a = [v];
    R[p.id] = { valores: a, nota: t !== null ? t : notaDe(p) };
    aplicar(); guardar(p); pintar(false);
    if (!p.multi && !p.nota && !p.texto) setTimeout(function () { if (PREG[i] === p) siguiente(); }, 420);
  }

  function guardarTexto(p) { var t = textoActual(); if (t === null) return; R[p.id] = { valores: valores(p), nota: t }; guardar(p); }
  function siguiente() { if (i < PREG.length - 1) i++; else fin = true; pintar(true); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  function anterior() { if (fin) { fin = false; i = PREG.length - 1; } else if (i > 0) i--; pintar(true); }

  function resumenFila(q) {
    var a = valores(q).map(function (x) { return etiq(q, x); }), n = notaDe(q).trim();
    if (n) a.push(n.length > 90 ? n.slice(0, 90) + '...' : n);
    return '<div class="fila"><span>' + q.t + '</span><b>' + (a.length ? a.join(', ') : 'Sin responder') + '</b></div>';
  }

  function pintar(anim) {
    var v = $('#vista'), p = PREG[i], pct, sa = anim ? '' : 'animation:none';
    pintarFases();
    if (fin) {
      pct = 100; $('#cont').textContent = NOM[fa] + ' completado';
      var intro = fa === 'enlace' ? 'La aplicación ya se ha adaptado a lo que has elegido.' : 'Con estos datos, la fase de desenlace interconectará todas tus respuestas para encontrar coincidencias y patrones.';
      v.innerHTML = '<div class="tarjeta" style="' + sa + '"><div class="etq">' + NOM[fa] + ' completado</div><h2>' + (fa === 'enlace' ? 'Perfil completo' : 'Propósito definido') + '</h2><p class="sub">' + intro + '</p>' +
        PREG.filter(function (q) { return q.op || q.texto; }).filter(function (q) { return q.id !== 'nota'; }).map(resumenFila).join('') +
        '<div class="acciones"><button class="btn" id="ant" type="button">Revisar respuestas</button></div></div>';
    } else {
      pct = Math.round(i / PREG.length * 100); $('#cont').textContent = NOM[fa] + ' · Pregunta ' + (i + 1) + ' de ' + PREG.length;
      var h = '<div class="tarjeta" style="' + sa + '"><div class="etq">' + p.t + '</div><h2>' + p.q + '</h2><p class="sub">' + p.s + '</p>';
      if (p.op) h += '<div class="ops">' + p.op.map(function (o) { var on = valores(p).indexOf(o.v) >= 0; return '<button type="button" class="op' + (on ? ' elegida' : '') + '" role="' + (p.multi ? 'checkbox' : 'radio') + '" aria-checked="' + on + '" data-v="' + o.v + '"><span class="sw" style="' + o.sw + '">' + (o.tx || '') + '</span><span><b>' + o.l + '</b><small>' + o.d + '</small></span></button>'; }).join('') + '</div>';
      if (p.texto || p.nota) h += '<textarea id="nota" class="' + (p.texto ? '' : 'corta') + '" placeholder="' + (p.ph || 'Escribe aquí') + '"></textarea>';
      var ok = p.texto ? (!p.req || notaDe(p).trim().length > 2) : valores(p).length > 0;
      h += '<div class="acciones">' + (i > 0 ? '<button class="btn" id="ant" type="button">Anterior</button>' : '') + '<button class="btn pri" id="sig" type="button"' + (ok ? '' : ' disabled') + '>' + (i === PREG.length - 1 ? 'Finalizar' : 'Continuar') + '</button></div></div>';
      v.innerHTML = h;
      var n = $('#nota');
      if (n) {
        n.value = notaDe(p);
        n.addEventListener('input', function () { if (p.texto && p.req) $('#sig').disabled = n.value.trim().length <= 2; });
        n.addEventListener('change', function () { guardarTexto(p); });
      }
    }
    $('#rel').style.width = pct + '%';
    var a = $('#ant'); if (a) a.addEventListener('click', anterior);
    var s = $('#sig'); if (s) s.addEventListener('click', function () { guardarTexto(p); siguiente(); });
    document.querySelectorAll('.op').forEach(function (b) { b.addEventListener('click', function () { elegir(p, b.getAttribute('data-v')); }); });
    pintarPerfil();
  }

  window.IKI = { ir: function (n, f) { if (f) { fa = f; PREG = LIST[f]; } fin = n >= PREG.length; i = Math.min(n, PREG.length - 1); pintar(false); } };
  IKIAuth.listo.then(cargar).then(function () { cargado = true; aplicar(); pintar(false); });
  setTimeout(function () { if (!cargado) pintar(false); }, 2500);
})();
</script>
